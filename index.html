.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.body::-webkit-scrollbar{width:4px}
.body::-webkit-scrollbar-thumb{background:#C4C8CF;border-radius:4px}
.row{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .3s ease}
.row.usr{justify-content:flex-end}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.bub.usr{background:#1A4975;color:#fff;border-radius:14px 14px 4px 14px}

.subs{display:flex;flex-direction:column;gap:5px;margin:7px 0 0 36px}

.inp-area{padding:10px 14px 14px;background:#fff;border-top:1px solid #E8EAEF;flex-shrink:0}
.inp-row{display:flex;gap:8px;align-items:center}

.inp-row input::placeholder{color:#A0A5AE}

.send:not(.off):hover{background:#0F2B47}

.card-info{background:#F0F4FA;border:1px solid #D4DBE8;border-radius:10px;padding:12px 14px;margin-top:6px;font-size:12.5px;line-height:1.7;color:#1a1a1a}

function parseAmount(input){
  var n = input.replace(/[,\s]/g,"");
  var mMan = n.match(/(\d+)만/);
  if(mMan) return parseInt(mMan[1]) * 10000;
  var mWon = n.match(/(\d{5,})원?/);
  if(mWon) return parseInt(mWon[1]);
  var mSmall = n.match(/(\d{2,3})원/);
  if(mSmall){ var v = parseInt(mSmall[1]); if(v >= 10 && v <= 999) return v * 10000; }
  return null;
}
function parseTotalNum(str){
  var s = str.replace(/[최대,\s원]/g,"");
  var m = s.match(/(\d[\d,]*)/);
  return m ? parseInt(m[1].replace(/,/g,"")) : 0;
}
function parseSpendNum(str){
  var m = str.match(/(\d+)/);
  return m ? parseInt(m[1]) * 10000 : 0;
}
function parseCountLimit(input){
  var n = input.replace(/\s/g,"");
  var m = n.match(/(\d+)개/);
  return m ? parseInt(m[1]) : null;
}
function matchCard(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  for(var k in CARDS){
    var c = CARDS[k];
    for(var i=0;i<c.kw.length;i++){
      if(n.indexOf(c.kw[i]) !== -1) return k;
    }
  }
  return null;
}
function handleCompare(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  return n.indexOf("비교")!==-1||n.indexOf("전체")!==-1||n.indexOf("목록")!==-1||n.indexOf("어떤카드")!==-1||n.indexOf("뭐가있")!==-1||n.indexOf("종류")!==-1;

  var dateMatch = input.match(/(\d{4})년\s*(\d{1,2})월/);
  var hasCancel = n.indexOf("해지")!==-1||n.indexOf("안썼")!==-1||n.indexOf("안쓴")!==-1||n.indexOf("사용안")!==-1||n.indexOf("이력없")!==-1;
  if(dateMatch && hasCancel){

    if(cancelDate >= reqStart){

/* ============================================================
   고급 분석: 누적 혜택 계산 (장기 합산) - 총 혜택 기반
   ============================================================ */
function handleCumulativeCalc(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasCumul = (n.indexOf("총")!==-1||n.indexOf("누적")!==-1||n.indexOf("합산")!==-1||n.indexOf("차이")!==-1||n.indexOf("차액")!==-1) && (n.indexOf("개월")!==-1||n.indexOf("년")!==-1||n.indexOf("동안")!==-1);
  if(!hasCumul) return false;
  var matched = [];
  for(var k in CARDS){
    var c = CARDS[k];
    for(var i=0;i<c.kw.length;i++){
      if(n.indexOf(c.kw[i])!==-1){ matched.push(k); break; }
    }
  }
  if(matched.length < 2) return false;
  var monthMatch = n.match(/(\d+)개월/);
  var yearMatch = n.match(/(\d+)년/);
  var months = monthMatch ? parseInt(monthMatch[1]) : (yearMatch ? parseInt(yearMatch[1])*12 : null);
  if(!months) return false;

  var amount = parseAmount(input);
  var c1 = CARDS[matched[0]], c2 = CARDS[matched[1]];

  // 해당 실적 구간의 총 혜택으로 계산
  function getMonthlyTotal(card, amt){
    var best = null;
    card.tiers.forEach(function(t){
      if(!amt || amt >= parseSpendNum(t.spend)) best = t;
    });
    return best ? parseTotalNum(best.total) : 0;
  }

  var m1 = getMonthlyTotal(c1, amount);
  var m2 = getMonthlyTotal(c2, amount);

  // 혜택 기간 제한 확인
  var d1 = parseInt(c1.duration) || 999;
  var d2 = parseInt(c2.duration) || 999;
  var eff1 = Math.min(months, d1);
  var eff2 = Math.min(months, d2);

  var total1 = m1 * eff1;
  var total2 = m2 * eff2;
  var diff = Math.abs(total1 - total2);
  var winner = total1 > total2 ? c1.name : (total2 > total1 ? c2.name : "동일");

  var amtLabel = amount ? (amount/10000)+"만원" : "최소 실적";
  var msg = "■ "+months+"개월 누적 총 혜택 비교 (자료 근거):\n\n[답변]\n";
  msg += "전월 실적: "+amtLabel+" 기준\n\n";
  msg += c1.name+":\n  월 혜택: "+m1.toLocaleString()+"원 x "+eff1+"개월";
  if(eff1 < months) msg += " (혜택 기간 "+c1.duration+"으로 "+months+"개월 중 "+eff1+"개월만 적용)";
  msg += "\n  누적 합계: "+total1.toLocaleString()+"원\n\n";
  msg += c2.name+":\n  월 혜택: "+m2.toLocaleString()+"원 x "+eff2+"개월";
  if(eff2 < months) msg += " (혜택 기간 "+c2.duration+"으로 "+months+"개월 중 "+eff2+"개월만 적용)";
  msg += "\n  누적 합계: "+total2.toLocaleString()+"원\n\n";
  msg += "차액: "+diff.toLocaleString()+"원";
  if(winner !== "동일") msg += " ("+winner+" 유리)";
  msg += "\n\n※ 위 계산은 제공된 자료의 총 할인 금액(기본+프로모션) 기준이며, 매월 전월 실적 충족을 가정합니다.";
  addBot(msg);
  return true;
}

/* ============================================================
   고급 분석: 복합 조건 검색 (총 혜택 N원 이상 + 최저 실적)
   ============================================================ */
function handleComplexFilter(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  // "N원 이상이면서" + "실적 조건이 가장 낮은" 패턴
  var hasFilter = (n.indexOf("이상이면서")!==-1||n.indexOf("이상이고")!==-1||(n.indexOf("이상")!==-1&&n.indexOf("낮은")!==-1)||(n.indexOf("이상")!==-1&&n.indexOf("적은")!==-1));
  if(!hasFilter) return false;

  var amount = parseAmount(input);
  if(!amount) return false;
  var amountVal = amount; // 원 단위

  var results = [];
  for(var k in CARDS){
    var c = CARDS[k];
    c.tiers.forEach(function(t){
      var totalVal = parseTotalNum(t.total);
      var spendVal = parseSpendNum(t.spend);
      if(totalVal >= amountVal / 10000){
        // amountVal은 원 단위로 파싱됨, totalVal은 만원 없이 숫자
        // 재확인: parseTotalNum("23,000원") = 23000
        if(totalVal * 1 >= amount / 1){
          results.push({key:k, card:c, tier:t, totalVal:totalVal, spendVal:spendVal});
        }
      }
    });
  }

  // 총 혜택이 threshold 이상인 것 필터
  var threshold = amount; // 이미 원 단위
  // parseTotalNum은 콤마 제거 후 숫자 반환 → "23,000원" → 23000
  results = results.filter(function(r){ return r.totalVal >= threshold; });

  if(results.length === 0){
    // threshold를 만원 단위로도 시도
    results = [];
    for(var k2 in CARDS){
      var c2 = CARDS[k2];
      c2.tiers.forEach(function(t){
        var totalVal = parseTotalNum(t.total);
        var spendVal = parseSpendNum(t.spend);
        if(totalVal >= threshold / 10000 * 10000){
          results.push({key:k2, card:c2, tier:t, totalVal:totalVal, spendVal:spendVal});
        }
      });
    }
  }

  if(results.length === 0){
    addBot("제공된 자료 내에서 해당 조건에 맞는 카드를 찾을 수 없습니다.");
    return true;
  }

  // 실적 조건이 낮은 순 정렬
  results.sort(function(a,b){ return a.spendVal - b.spendVal; });
  // 중복 카드 제거 (같은 카드의 다른 실적구간)
  var seen2 = {};
  results = results.filter(function(r){ if(seen2[r.key]) return false; seen2[r.key]=true; return true; });

  var limit2 = parseCountLimit(input);
  var dr2 = limit2 ? results.slice(0, limit2) : results;

  var msg = "■ 총 혜택 "+(threshold).toLocaleString()+"원 이상 & 최저 실적 순 (자료 근거):\n\n[답변]\n";
  dr2.forEach(function(r,i){
    msg += (i+1)+". "+r.card.name+"\n   총 혜택: "+r.tier.total+" / 전월 실적: "+r.tier.spend+"\n";
    if(r.tier.promo && r.tier.promo !== "-") msg += "   (기본 "+r.tier.base+" "+r.tier.promo+")\n";
    msg += "\n";
  });
  addBot(msg);
  return true;
}

/* ============================================================
   고급 분석: 카드 간 비교 (같은 실적에서 유불리 판단)
   ============================================================ */
function handleCardComparison(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  // 두 카드 비교 + 실적 언급
  var matched2 = [];
  for(var k in CARDS){
    var c = CARDS[k];
    for(var i=0;i<c.kw.length;i++){
      if(n.indexOf(c.kw[i])!==-1){ matched2.push(k); break; }
    }
  }
  if(matched2.length !== 2) return false;
  var hasCompKw = n.indexOf("유리")!==-1||n.indexOf("좋")!==-1||n.indexOf("나은")!==-1||n.indexOf("선택")!==-1||n.indexOf("추천")!==-1||n.indexOf("비교")!==-1||n.indexOf("뭐가")!==-1||n.indexOf("어떤")!==-1||n.indexOf("어느")!==-1;
  if(!hasCompKw && n.indexOf("차이")===-1) return false;
  // 누적 계산은 handleCumulativeCalc에서 처리
  if((n.indexOf("총")!==-1||n.indexOf("누적")!==-1||n.indexOf("합산")!==-1)&&(n.indexOf("개월")!==-1||n.indexOf("년")!==-1)) return false;

  var amount2 = parseAmount(input);
  var c1 = CARDS[matched2[0]], c2 = CARDS[matched2[1]];

  if(amount2){
    // 특정 실적 기준 비교
    var t1 = null, t2 = null;
    c1.tiers.forEach(function(t){ if(amount2 >= parseSpendNum(t.spend)) t1 = t; });
    c2.tiers.forEach(function(t){ if(amount2 >= parseSpendNum(t.spend)) t2 = t; });
    var amtMan = amount2 / 10000;

    if(!t1 && !t2){
      addBot("제공된 자료 기준, 전월 실적 "+amtMan+"만원 구간에서 두 카드 모두 해당하는 혜택이 없습니다.");
      return true;
    }

    var v1 = t1 ? parseTotalNum(t1.total) : 0;
    var v2 = t2 ? parseTotalNum(t2.total) : 0;
    var s1 = t1 ? parseSpendNum(t1.spend) : 0;
    var s2 = t2 ? parseSpendNum(t2.spend) : 0;

    var msg = "■ "+c1.name+" vs "+c2.name+" 비교 (자료 근거):\n\n[답변]\n";
    msg += "전월 실적 "+amtMan+"만원 기준:\n\n";
    msg += "  "+c1.name+":\n";
    msg += "    혜택: "+(t1?t1.total:"해당 구간 없음")+"\n";
    msg += "    필요 실적: "+(t1?t1.spend:"없음")+" / 혜택 기간: "+c1.duration+"\n\n";
    msg += "  "+c2.name+":\n";
    msg += "    혜택: "+(t2?t2.total:"해당 구간 없음")+"\n";
    msg += "    필요 실적: "+(t2?t2.spend:"없음")+" / 혜택 기간: "+c2.duration+"\n\n";

    if(v1 === v2 && v1 > 0){
      // 혜택 같으면 실적 기준 비교
      if(s1 < s2){
        msg += "결론: 월 혜택 금액은 동일하나, "+c1.name+"의 필요 실적("+c1.tiers[0].spend+")이 더 낮아 실적 충족이 용이합니다.";
      } else if(s2 < s1){
        msg += "결론: 월 혜택 금액은 동일하나, "+c2.name+"의 필요 실적("+c2.tiers[0].spend+")이 더 낮아 실적 충족이 용이합니다.";
      } else {
        // 혜택 기간 비교
        var d1 = parseInt(c1.duration) || 0;
        var d2 = parseInt(c2.duration) || 0;
        if(d1 > d2) msg += "결론: 월 혜택과 필요 실적이 동일하나, "+c1.name+"의 혜택 기간("+c1.duration+")이 더 깁니다.";
        else if(d2 > d1) msg += "결론: 월 혜택과 필요 실적이 동일하나, "+c2.name+"의 혜택 기간("+c2.duration+")이 더 깁니다.";
        else msg += "결론: 월 혜택, 필요 실적, 혜택 기간이 모두 동일합니다.";
      }
    } else if(v1 > v2){
      msg += "결론: "+c1.name+"이(가) 월 "+(v1-v2).toLocaleString()+"원 더 많은 혜택을 제공합니다.";
    } else if(v2 > v1){
      msg += "결론: "+c2.name+"이(가) 월 "+(v2-v1).toLocaleString()+"원 더 많은 혜택을 제공합니다.";
    }

    addBot(msg);
    return true;
  }

  // 실적 미지정 시 전체 구간 비교
  var msg2 = "■ "+c1.name+" vs "+c2.name+" 전체 비교 (자료 근거):\n\n[답변]\n";
  msg2 += c1.name+" ("+c1.duration+"):\n";
  c1.tiers.forEach(function(t){ msg2 += "  "+t.spend+": "+t.total+(t.promo&&t.promo!=="-"?" (기본 "+t.base+" "+t.promo+")":"")+"\n"; });
  msg2 += "\n"+c2.name+" ("+c2.duration+"):\n";
  c2.tiers.forEach(function(t){ msg2 += "  "+t.spend+": "+t.total+(t.promo&&t.promo!=="-"?" (기본 "+t.base+" "+t.promo+")":"")+"\n"; });
  addBot(msg2);
  return true;
}

/* ============================================================
   고급 분석: 기본 vs 프로모션 비중 (데이터 분해)
   ============================================================ */
function handlePromoRatioCheck(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasRatio = (n.indexOf("기본")!==-1&&n.indexOf("프로모션")!==-1)||(n.indexOf("기본할인")!==-1&&n.indexOf("추가")!==-1)||n.indexOf("비중")!==-1||(n.indexOf("프로모션")!==-1&&(n.indexOf("큰")!==-1||n.indexOf("많은")!==-1||n.indexOf("높은")!==-1||n.indexOf("더")!==-1));
  if(!hasRatio) return false;

  var results = [];
  for(var k in CARDS){
    var c = CARDS[k];
    if(PROMO_CARDS.indexOf(k)===-1) continue;
    c.tiers.forEach(function(t){
      if(t.promo && t.promo !== "-"){
        var baseVal = parseInt(t.base.replace(/[^0-9]/g,""));
        var promoVal = parseInt(t.promo.replace(/[^0-9]/g,""));
        if(promoVal > baseVal){
          results.push({key:k, card:c, tier:t, baseVal:baseVal, promoVal:promoVal, diff: promoVal - baseVal});
        }
      }
    });
  }

  if(results.length === 0){
    addBot("제공된 자료 내에서 프로모션 추가분이 기본 할인보다 큰 카드/구간을 찾을 수 없습니다.");
    return true;
  }

  results.sort(function(a,b){ return b.diff - a.diff; });

  var msg = "■ 프로모션 추가분이 기본 할인보다 큰 카드/구간 (자료 근거):\n\n[답변]\n";
  var seen3 = {};
  results.forEach(function(r){
    var label = r.card.name+" ("+r.tier.spend+")";
    if(!seen3[label]){
      msg += "- "+label+":\n  기본 할인: "+r.tier.base+" / 프로모션 추가: "+r.tier.promo+"\n  → 프로모션이 "+(r.diff).toLocaleString()+"원 더 큼\n\n";
      seen3[label] = true;
    }
  });
  addBot(msg);
  return true;
}

/* ============================================================
   고급 분석: 마감 기한 / 날짜 판별
   ============================================================ */
function handleDeadlineCheck(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasDeadline = (n.indexOf("내일")!==-1||n.indexOf("오늘")!==-1||n.indexOf("마감")!==-1||n.indexOf("마지막")!==-1||n.indexOf("신청하면")!==-1||n.indexOf("가입하면")!==-1) && (n.indexOf("가능")!==-1||n.indexOf("받을수")!==-1||n.indexOf("되")!==-1||n.indexOf("할수")!==-1||n.indexOf("프로모션")!==-1);
  if(!hasDeadline) return false;

  // 날짜 추출: N월 N일
  var fullDate = input.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
  var monthDay = input.match(/(\d{1,2})월\s*(\d{1,2})일/);

  var checkDate = null;
  if(n.indexOf("내일")!==-1){
    // 입력에서 오늘 날짜 추출
    var todayMatch = input.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
    if(todayMatch){
      checkDate = new Date(parseInt(todayMatch[1]), parseInt(todayMatch[2])-1, parseInt(todayMatch[3])+1);
    }
  } else if(n.indexOf("오늘")!==-1 && fullDate){
    checkDate = new Date(parseInt(fullDate[1]), parseInt(fullDate[2])-1, parseInt(fullDate[3]));
  } else if(fullDate){
    checkDate = new Date(parseInt(fullDate[1]), parseInt(fullDate[2])-1, parseInt(fullDate[3]));
  } else if(monthDay){
    checkDate = new Date(2026, parseInt(monthDay[1])-1, parseInt(monthDay[2]));
  }

  if(!checkDate) return false;

  var deadline = new Date(2026, 3, 30); // 4월 30일
  var startDate = new Date(2026, 3, 1); // 4월 1일

  var dateStr = checkDate.getFullYear()+"년 "+(checkDate.getMonth()+1)+"월 "+checkDate.getDate()+"일";

  if(checkDate >= startDate && checkDate <= deadline){
    addBot("■ 프로모션 신청 가능 여부 (자료 근거):\n\n[답변]\n가능합니다.\n\n근거: 4월 프로모션 행사 기간은 2026년 4월 1일 ~ 4월 30일입니다.\n"+dateStr+"은 행사 기간 내이므로 신청 가능합니다.");
  } else if(checkDate > deadline){
    addBot("■ 프로모션 신청 가능 여부 (자료 근거):\n\n[답변]\n불가능합니다.\n\n근거: 4월 프로모션 행사 기간은 2026년 4월 1일 ~ 4월 30일입니다.\n"+dateStr+"은 행사 기간 이후이므로 프로모션 적용이 불가합니다.");
  } else {
    addBot("■ 프로모션 신청 가능 여부 (자료 근거):\n\n[답변]\n아직 행사 시작 전입니다.\n\n근거: 4월 프로모션 행사 기간은 2026년 4월 1일 ~ 4월 30일입니다.\n"+dateStr+"은 행사 시작일 이전입니다.");
  }
  return true;
}

/* ============================================================
   고급 분석: 가성비(효율) 계산
   ============================================================ */
function handleEfficiencyCalc(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasEff = n.indexOf("가성비")!==-1||n.indexOf("효율")!==-1||(n.indexOf("1원당")!==-1)||(n.indexOf("원당")!==-1&&n.indexOf("할인")!==-1)||n.indexOf("퍼센트")!==-1||(n.indexOf("%")!==-1&&(n.indexOf("높")!==-1||n.indexOf("큰")!==-1||n.indexOf("좋")!==-1));
  if(!hasEff) return false;

  var allTiers = [];
  for(var k in CARDS){
    var c = CARDS[k];
    if(PROMO_CARDS.indexOf(k)===-1 && NORMAL_CARDS.indexOf(k)===-1) continue;
    c.tiers.forEach(function(t){
      var totalVal = parseTotalNum(t.total);
      var spendVal = parseSpendNum(t.spend);
      if(spendVal > 0 && totalVal > 0){
        var ratio = (totalVal / spendVal * 100);
        allTiers.push({key:k, card:c, tier:t, totalVal:totalVal, spendVal:spendVal, ratio:ratio});
      }
    });
  }

  allTiers.sort(function(a,b){ return b.ratio - a.ratio; });

  var limit = parseCountLimit(input);
  var dc = limit ? Math.min(limit, allTiers.length) : Math.min(10, allTiers.length);
  var dr = allTiers.slice(0, dc);

  var msg = "■ 실적 대비 할인 효율(가성비) 순위 (자료 근거):\n\n[답변]\n";
  dr.forEach(function(r,i){
    msg += (i+1)+". "+r.card.name+" ("+r.tier.spend+" 구간)\n";
    msg += "   할인: "+r.tier.total+" / 실적: "+r.tier.spend+"\n";
    msg += "   효율: "+r.ratio.toFixed(1)+"%\n";
    if(r.tier.promo && r.tier.promo !== "-") msg += "   (기본 "+r.tier.base+" "+r.tier.promo+")\n";
    msg += "\n";
  });
  msg += "※ 효율(%) = 월 할인액 ÷ 전월 실적 × 100\n※ 높을수록 적은 실적으로 많은 할인을 받는 '가성비' 구간입니다.";
  addBot(msg);
  return true;
}

/* ============================================================
   고급 분석: 다중 조건 필터 (기간+프로모션금액+실적 동시)
   ============================================================ */
function handleMultiCondFilter(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  // "60개월이면서" + "1만원 이상" + "30만원" 같은 다중 조건
  var hasMulti = (n.indexOf("이면서")!==-1||n.indexOf("이고")!==-1||n.indexOf("동시")!==-1) && (n.indexOf("개월")!==-1||n.indexOf("년")!==-1);
  if(!hasMulti) return false;

  // 기간 조건 추출
  var monthMatch = n.match(/(\d+)개월/);
  var months = monthMatch ? parseInt(monthMatch[1]) : null;
  if(!months) return false;

  // 프로모션 금액 조건 추출 (여러 금액 중 프로모션 관련)
  var promoAmtMatch = input.match(/(?:프로모션|추가|캐시백)[\s\S]*?(\d+)[\s]*(?:만|천)/);
  var promoThreshold = 0;
  if(promoAmtMatch){
    var pv = parseInt(promoAmtMatch[1]);
    if(input.indexOf("만")!==-1 && promoAmtMatch[0].indexOf("만")!==-1) promoThreshold = pv * 10000;
    else if(promoAmtMatch[0].indexOf("천")!==-1) promoThreshold = pv * 1000;
    else promoThreshold = pv;
  }
  // 더 단순한 패턴: "1만 원 이상이고"
  if(promoThreshold === 0){
    var simpleMatch = input.match(/(\d+)[\s]*만[\s]*원?\s*이상/g);
    if(simpleMatch && simpleMatch.length > 0){
      // 가장 작은 금액을 프로모션 기준으로
      var amounts = simpleMatch.map(function(s){ var m = s.match(/(\d+)/); return m ? parseInt(m[1]) : 0; });
      amounts.sort(function(a,b){return a-b;});
      // 10 이하면 만원 단위
      if(amounts[0] <= 10) promoThreshold = amounts[0] * 10000;
      else promoThreshold = amounts[0];
    }
  }

  // 실적 조건 추출
  var spendCondition = null;
  var spendMatch = input.match(/실적[\s]*(?:조건)?[\s]*(?:이|가)?[\s]*(\d+)[\s]*만/);
  if(spendMatch) spendCondition = parseInt(spendMatch[1]) * 10000;
  // "전월 실적 30만원" 패턴
  if(!spendCondition){
    var allAmounts = [];
    var amtMatches = input.match(/(\d+)[\s]*만[\s]*원/g);
    if(amtMatches){
      amtMatches.forEach(function(s){ var m = s.match(/(\d+)/); if(m) allAmounts.push(parseInt(m[1])*10000); });
    }
    // 30만원 이상인 것 중 실적 조건으로 추정
    allAmounts.forEach(function(a){ if(a >= 300000 && !spendCondition) spendCondition = a; });
  }

  var results = [];
  PROMO_CARDS.forEach(function(k){
    var c = CARDS[k];
    var dur = parseInt(c.duration) || 0;
    if(dur < months) return; // 기간 조건 미충족

    c.tiers.forEach(function(t){
      if(!t.promo || t.promo === "-") return;
      var promoVal = parseInt(t.promo.replace(/[^0-9]/g,""));
      var spendVal = parseSpendNum(t.spend);

      var passPromo = promoThreshold > 0 ? promoVal >= promoThreshold : true;
      var passSpend = spendCondition ? spendVal <= spendCondition : true;

      if(passPromo && passSpend){
        results.push({key:k, card:c, tier:t, promoVal:promoVal, spendVal:spendVal, dur:dur});
      }
    });
  });

  // 중복 카드 제거 (최소 실적 구간만)
  var seen = {};
  results = results.filter(function(r){ if(seen[r.key]) return false; seen[r.key]=true; return true; });

  if(results.length === 0){
    addBot("제공된 자료 내에서 해당 조건을 모두 충족하는 카드를 찾을 수 없습니다.\n\n적용된 조건:\n- 혜택 기간: "+months+"개월 이상"+(promoThreshold>0?"\n- 프로모션 추가분: "+promoThreshold.toLocaleString()+"원 이상":"")+(spendCondition?"\n- 전월 실적: "+(spendCondition/10000)+"만원 이하":""));
    return true;
  }

  var msg = "■ 다중 조건 검색 결과 (자료 근거):\n\n적용 조건:\n- 혜택 기간: "+months+"개월 이상"+(promoThreshold>0?"\n- 프로모션 추가분: "+promoThreshold.toLocaleString()+"원 이상":"")+(spendCondition?"\n- 전월 실적: "+(spendCondition/10000)+"만원 구간":"") +"\n\n[답변]\n";
  results.forEach(function(r,i){
    msg += (i+1)+". "+r.card.name+"\n";
    msg += "   혜택 기간: "+r.card.duration+" / 실적: "+r.tier.spend+"\n";
    msg += "   기본: "+r.tier.base+" + 프로모션: "+r.tier.promo+" = "+r.tier.total+"\n\n";
  });
  addBot(msg);
  return true;
}

/* ============================================================
   고급 분석: 혜택 만료 탐색 (N개월 후 쓸모없어지는 카드)
   ============================================================ */
function handleExpiryCheck(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasExpiry = (n.indexOf("사라")!==-1||n.indexOf("만료")!==-1||n.indexOf("끝나")!==-1||n.indexOf("없어")!==-1||n.indexOf("쓸모")!==-1||n.indexOf("끝")!==-1) && (n.indexOf("개월")!==-1||n.indexOf("년")!==-1||n.indexOf("차")!==-1);
  if(!hasExpiry) return false;

  var monthMatch = n.match(/(\d+)[\s]*개월/);
  var yearMatch = n.match(/(\d+)[\s]*년/);
  var checkMonth = monthMatch ? parseInt(monthMatch[1]) : (yearMatch ? parseInt(yearMatch[1])*12 : null);
  // "4년차" 패턴
  var chaMatch = n.match(/(\d+)[\s]*년[\s]*차/);
  if(chaMatch) checkMonth = (parseInt(chaMatch[1])-1)*12 + 1; // N년차 시작 = (N-1)*12+1개월

  if(!checkMonth) return false;

  var expired = [];
  PROMO_CARDS.forEach(function(k){
    var c = CARDS[k];
    var dur = parseInt(c.duration) || 999;
    if(dur < checkMonth){
      expired.push({key:k, card:c, dur:dur});
    }
  });

  if(expired.length === 0){
    addBot("■ "+checkMonth+"개월 시점 혜택 만료 카드 (자료 근거):\n\n[답변]\n제공된 자료 기준, 모든 프로모션 카드의 혜택이 "+checkMonth+"개월 시점까지 유효합니다.\n해당 시점에 혜택이 사라지는 카드는 없습니다.");
    return true;
  }

  var msg = "■ "+checkMonth+"개월 시점 혜택 만료 카드 (자료 근거):\n\n[답변]\n다음 카드는 프로모션 혜택 기간이 "+checkMonth+"개월 미만이므로, 해당 시점에는 프로모션 추가 혜택이 종료됩니다:\n\n";
  expired.forEach(function(r){
    msg += "- "+r.card.name+": 혜택 기간 "+r.card.duration+" ("+r.dur+"개월 후 프로모션 종료)\n";
  });
  msg += "\n※ 프로모션 종료 후에도 기본 청구할인은 카드 유효기간까지 유지될 수 있습니다. 상세 내용은 해당 카드사로 문의 바랍니다.";
  addBot(msg);
  return true;
}

/* ============================================================

/* ============================================================

function handleFactCheck(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasVerify = n.indexOf("사실이")!==-1||n.indexOf("사실인")!==-1||n.indexOf("맞아")!==-1||n.indexOf("맞는")!==-1||n.indexOf("맞나")!==-1||n.indexOf("정말")!==-1||n.indexOf("진짜")!==-1||n.indexOf("아니라면")!==-1||n.indexOf("틀린")!==-1;
  if(!hasVerify) return false;

  var ck = matchCard(input);
  if(!ck) return false;
  var c = CARDS[ck];

  // 금액 추출
  var claimedAmt = parseAmount(input);
  if(!claimedAmt) return false;

  // 해당 카드의 실제 최소 실적 확인
  var minSpend = Infinity;
  c.tiers.forEach(function(t){
    var sv = parseSpendNum(t.spend);
    if(sv < minSpend) minSpend = sv;
  });
  var minSpendMan = minSpend / 10000;

  // 주장된 금액과 실제 최소 실적 비교
  if(claimedAmt < minSpend){
    addBot("■ "+c.name+" 정보 검증 (자료 근거):\n\n[답변]\n아니요, 사실이 아닙니다.\n\n제공된 자료 기준, "+c.name+"의 최소 전월 실적 조건은 "+minSpendMan+"만원 이상입니다.\n\n"+(claimedAmt/10000)+"만원으로는 혜택을 받을 수 없습니다.\n\n실적별 혜택:\n");
    var sub = "";
    c.tiers.forEach(function(t){ sub += "  "+t.spend+": "+t.total+"\n"; });
    addBot(sub);
    return true;
  } else {
    // 해당 금액에서의 실제 혜택 확인
    var matchedTier = null;
    c.tiers.forEach(function(t){
      if(claimedAmt >= parseSpendNum(t.spend)) matchedTier = t;
    });
    if(matchedTier){
      addBot("■ "+c.name+" 정보 검증 (자료 근거):\n\n[답변]\n네, 전월 실적 "+(claimedAmt/10000)+"만원 이상 시 혜택을 받을 수 있습니다.\n\n해당 구간 혜택: "+matchedTier.total+"\n(기본 "+matchedTier.base+(matchedTier.promo&&matchedTier.promo!=="-"?" "+matchedTier.promo:"")+")");
      return true;
    }
  }
  return false;
}

/* ============================================================
   케이스2: 혜택 방식 차이 (청구할인 vs 캐시백)
   ============================================================ */
function handleBenefitTypeDiff(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasDiff = (n.indexOf("다른점")!==-1||n.indexOf("다른")!==-1||n.indexOf("차이점")!==-1||n.indexOf("차이")!==-1||n.indexOf("결정적")!==-1||n.indexOf("특이")!==-1||n.indexOf("독특")!==-1) && (n.indexOf("현금")!==-1||n.indexOf("캐시백")!==-1||n.indexOf("청구할인")!==-1||n.indexOf("방식")!==-1||n.indexOf("흐름")!==-1||n.indexOf("형태")!==-1);
  if(!hasDiff) return false;

  var ck = matchCard(input);

  // NH농협 관련이면 캐시백 vs 청구할인 차이 설명
  if(ck === "nh" || n.indexOf("농협")!==-1 || n.indexOf("nh")!==-1){
    addBot("■ 코웨이 NH농협카드의 결정적 차이 (자료 근거):\n\n[답변]\n코웨이 NH농협카드는 다른 제휴카드들과 혜택 지급 방식이 다릅니다.\n\n- 다른 카드 (신한, 우리, 삼성, KB국민, LOCA, 현대): 청구할인\n  → 렌탈료 청구 시 할인 금액이 차감되어 청구됨\n\n- NH농협카드: 캐시백\n  → 프로모션 추가분이 캐시백으로 지급됨\n\n자료 근거: NH농협카드 프로모션 항목에 '캐시백'으로 명시되어 있으며, 다른 카드는 '청구할인'으로 명시되어 있습니다.\n\n[문의 안내]\n캐시백 지급 시점 등 상세 내용은 NH농협카드(1644-2866)로 문의 바랍니다.");
    return true;
  }

  // 일반적 혜택 방식 비교 질문
  if(!ck){
    addBot("■ 제휴카드 혜택 방식 차이 (자료 근거):\n\n[답변]\n제공된 자료 기준, 대부분의 카드는 '청구할인' 방식이나, NH농협카드만 프로모션 추가분이 '캐시백' 방식입니다.\n\n청구할인 카드: 신한, 우리, 삼성, KB국민, LOCA, 현대, IBK, 하나\n캐시백 카드: NH농협\n\n[문의 안내]\n상세 지급 방식은 각 카드사로 문의 바랍니다.");
    return true;
  }
  return false;
}

/* ============================================================
   케이스3: 실적 구간 효율 분석 (실적 증가 대비 혜택 증가)
   ============================================================ */
function handleTierEfficiency(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var ck = matchCard(input);
  if(!ck) return false;
  var c = CARDS[ck];

  // "실적 높였을 때", "올렸을 때", "추가로 얻는" 등
  var hasUpgrade = n.indexOf("높")!==-1||n.indexOf("올리")!==-1||n.indexOf("올렸")!==-1||n.indexOf("늘리")!==-1||n.indexOf("늘렸")!==-1||n.indexOf("추가로")!==-1||n.indexOf("에서")!==-1;
  var hasEval = n.indexOf("효율")!==-1||n.indexOf("가치")!==-1||n.indexOf("얼마꼴")!==-1||n.indexOf("이득")!==-1||n.indexOf("의미")!==-1||n.indexOf("꼴")!==-1;
  if(!hasUpgrade && !hasEval) return false;

  // 두 금액 추출
  var amtMatches = input.match(/(\d+)[\s]*만[\s]*원/g);
  if(!amtMatches || amtMatches.length < 2) return false;

  var amounts = amtMatches.map(function(s){ var m = s.match(/(\d+)/); return parseInt(m[1]) * 10000; });
  amounts.sort(function(a,b){return a-b;});
  var lowAmt = amounts[0], highAmt = amounts[amounts.length-1];

  var lowTier = null, highTier = null;
  c.tiers.forEach(function(t){
    if(lowAmt >= parseSpendNum(t.spend)) lowTier = t;
  });
  c.tiers.forEach(function(t){
    if(highAmt >= parseSpendNum(t.spend)) highTier = t;
  });

  if(!lowTier || !highTier){
    addBot("제공된 자료 내에서 해당 실적 구간 정보를 찾을 수 없습니다.");
    return true;
  }

  var lowVal = parseTotalNum(lowTier.total);
  var highVal = parseTotalNum(highTier.total);
  var benefitDiff = highVal - lowVal;
  var spendDiff = highAmt - lowAmt;
  var ratio = spendDiff > 0 ? (benefitDiff / spendDiff * 100).toFixed(2) : 0;

  var msg = "■ "+c.name+" 실적 구간 효율 분석 (자료 근거):\n\n[답변]\n";
  msg += "전월 실적 "+(lowAmt/10000)+"만원 → "+(highAmt/10000)+"만원 변경 시:\n\n";
  msg += "  기존 혜택 ("+(lowAmt/10000)+"만원): "+lowTier.total+"\n";
  msg += "  변경 혜택 ("+(highAmt/10000)+"만원): "+highTier.total+"\n";
  msg += "  추가 혜택: "+benefitDiff.toLocaleString()+"원/월\n";
  msg += "  추가 실적: "+(spendDiff).toLocaleString()+"원\n";
  msg += "  추가 효율: "+ratio+"%\n\n";

  if(benefitDiff === 0){
    msg += "결론: 실적을 높여도 혜택이 동일합니다. 실적을 높일 이유가 없습니다.";
  } else if(parseFloat(ratio) < 1){
    msg += "결론: 실적 "+(spendDiff).toLocaleString()+"원을 추가로 사용해야 혜택은 "+benefitDiff.toLocaleString()+"원만 증가합니다. 효율이 낮아 실적을 높이는 것이 효율적이지 않습니다.";
  } else {
    msg += "결론: 효율 "+ratio+"%로, 실적 증가 대비 혜택 증가가 있습니다.";
  }
  addBot(msg);
  return true;
}

/* ============================================================
   케이스4: 메타 질문 (문서에 없는 정보 확인)
   ============================================================ */
function handleMetaQuestion(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasMeta = (n.indexOf("문서에없")!==-1||n.indexOf("문서에나")!==-1||n.indexOf("알수없")!==-1||n.indexOf("없는정보")!==-1||n.indexOf("나와있")!==-1||n.indexOf("포함되어")!==-1) && (n.indexOf("연회비")!==-1||n.indexOf("디자인")!==-1||n.indexOf("교체")!==-1||n.indexOf("어떤정보")!==-1||n.indexOf("뭐가없")!==-1||n.indexOf("뭐야")!==-1);
  if(!hasMeta) return false;

  var docHas = "프로모션 기간, 대상 고객 조건, 전월 실적별 할인/캐시백 금액, 유의사항, 카드 신청 전화번호 및 페이지 링크";
  var docNotHas = "연회비, 카드 디자인, 교체 발급 가능 여부, 전월 실적 제외 항목 상세, 포인트 적립률, 부가 서비스, 해외 사용 가능 여부, 결제일 선택 옵션";

  addBot("■ 문서 포함/미포함 정보 (자료 근거):\n\n[답변]\n\n문서에 포함된 정보:\n"+docHas+"\n\n문서에 포함되지 않은 정보:\n"+docNotHas+"\n\n위 미포함 항목에 대해서는 제공된 자료 내에서 답변을 찾을 수 없습니다.\n\n[문의 안내]\n미포함 항목은 각 카드사 콜센터로 직접 문의 바랍니다.\n코웨이 콜센터: 1588-5200");
  return true;
}

/* ============================================================
   케이스5: 실적 분배 최적화 (카드 2장 조합)
   ============================================================ */
function handleSplitOptimization(input){
  var n = input.replace(/\s/g,"").toLowerCase();
  var hasSplit = (n.indexOf("2장")!==-1||n.indexOf("두장")!==-1||n.indexOf("2개")!==-1||n.indexOf("두개")!==-1) && (n.indexOf("분배")!==-1||n.indexOf("나눠")!==-1||n.indexOf("쪼개")!==-1||n.indexOf("조합")!==-1||n.indexOf("이득")!==-1||n.indexOf("각각")!==-1);
  if(!hasSplit) return false;

  var totalBudget = parseAmount(input);
  if(!totalBudget) return false;
  var budgetMan = totalBudget / 10000;

  // 모든 카드의 최소 실적 구간에서 혜택 계산
  var cardInfos = [];
  for(var k in CARDS){
    var c = CARDS[k];
    if(PROMO_CARDS.indexOf(k)===-1) continue;
    c.tiers.forEach(function(t,idx){
      var sv = parseSpendNum(t.spend);
      var tv = parseTotalNum(t.total);
      if(sv <= totalBudget){
        cardInfos.push({key:k, card:c, tier:t, spendVal:sv, totalVal:tv, tierIdx:idx});
      }
    });
  }

  // 2장 조합 최적화: 예산 내에서 합산 혜택 최대화
  var bestCombo = null;
  var bestTotal = 0;

  for(var i=0;i<cardInfos.length;i++){
    for(var j=i+1;j<cardInfos.length;j++){
      var a = cardInfos[i], b = cardInfos[j];
      if(a.key === b.key) continue; // 같은 카드 제외
      if(a.spendVal + b.spendVal <= totalBudget){
        var comboTotal = a.totalVal + b.totalVal;
        if(comboTotal > bestTotal){
          bestTotal = comboTotal;
          bestCombo = {a:a, b:b};
        }
      }
    }
  }

  // 단일 카드에 몰아쓰기 최대값
  var bestSingle = null;
  var bestSingleVal = 0;
  for(var k2 in CARDS){
    var c2 = CARDS[k2];
    if(PROMO_CARDS.indexOf(k2)===-1) continue;
    c2.tiers.forEach(function(t){
      if(totalBudget >= parseSpendNum(t.spend)){
        var tv2 = parseTotalNum(t.total);
        if(tv2 > bestSingleVal){ bestSingleVal = tv2; bestSingle = {key:k2, card:c2, tier:t}; }
      }
    });
  }

  var msg = "■ 카드 2장 실적 분배 최적화 (자료 근거):\n\n[답변]\n총 월 사용 예산: "+budgetMan+"만원\n\n";

  if(bestCombo && bestTotal > bestSingleVal){
    msg += "▸ 최적 2장 조합:\n";
    msg += "  1) "+bestCombo.a.card.name+": 실적 "+(bestCombo.a.spendVal/10000)+"만원 → 혜택 "+bestCombo.a.tier.total+"\n";
    msg += "  2) "+bestCombo.b.card.name+": 실적 "+(bestCombo.b.spendVal/10000)+"만원 → 혜택 "+bestCombo.b.tier.total+"\n";
    msg += "  합산 혜택: "+bestTotal.toLocaleString()+"원/월\n\n";
    msg += "▸ 단일 카드 최대 (비교용):\n";
    msg += "  "+bestSingle.card.name+": 실적 "+bestSingle.tier.spend+" → 혜택 "+bestSingle.tier.total+"\n\n";
    msg += "결론: 2장 분배 시 월 "+(bestTotal - bestSingleVal).toLocaleString()+"원 더 이득입니다.\n";
    msg += "예산 "+budgetMan+"만원을 쪼개 쓰는 것이 한 카드에 몰아 쓰는 것보다 유리합니다.";
  } else if(bestSingle){
    msg += "▸ 단일 카드 최대:\n";
    msg += "  "+bestSingle.card.name+": 혜택 "+bestSingle.tier.total+"\n\n";
    if(bestCombo){
      msg += "▸ 최적 2장 조합:\n";
      msg += "  1) "+bestCombo.a.card.name+": "+bestCombo.a.tier.total+"\n";
      msg += "  2) "+bestCombo.b.card.name+": "+bestCombo.b.tier.total+"\n";
      msg += "  합산: "+bestTotal.toLocaleString()+"원\n\n";
    }
    msg += "결론: 해당 예산에서는 단일 카드가 더 유리하거나 동일합니다.";
  }

  msg += "\n\n※ 위 분석은 프로모션 포함 총 혜택 기준이며, 각 카드의 유의사항을 별도 확인해 주세요.";
  addBot(msg);
  return true;
}

/* ============================================================
   메인 전송 처리 (최종 보강)
   ============================================================ */
function doSend(){
  var t = inp.value.trim();
  if(!t) return;
  addUsr(t); inp.value = "";
  setTimeout(function(){
    // 1. 유도 질문 반박 (사실 검증)
    if(handleFactCheck(t)) return;
    // 2. 메타 질문 (문서에 없는 정보)
    if(handleMetaQuestion(t)) return;
    // 3. 신규 자격 판별 (카드사 지정 + 날짜+해지)
    if(handleEligibilityCheck(t)) return;
    // 4. 신규 자격 판별 (카드사 미지정, 마지막 결제일)
    if(handleGeneralEligibility(t)) return;
    // 5. 마감 기한 판별
    if(handleDeadlineCheck(t)) return;
    // 6. 누적 혜택 계산
    if(handleCumulativeCalc(t)) return;
    // 7. 다중 조건 필터 (기간+프로모션+실적)
    if(handleMultiCondFilter(t)) return;
    // 8. 복합 조건 검색 (금액 이상 + 최저 실적)
    if(handleComplexFilter(t)) return;
    // 9. 실적 구간 효율 분석
    if(handleTierEfficiency(t)) return;
    // 10. 가성비/효율 계산
    if(handleEfficiencyCalc(t)) return;
    // 11. 혜택 만료 탐색
    if(handleExpiryCheck(t)) return;
    // 12. 혜택 방식 차이 (캐시백 vs 청구할인)
    if(handleBenefitTypeDiff(t)) return;
    // 13. 카드 2장 실적 분배 최적화
    if(handleSplitOptimization(t)) return;
    // 14. 카드 간 비교 (유불리)
    if(handleCardComparison(t)) return;
    // 15. 기본 vs 프로모션 비중
    if(handlePromoRatioCheck(t)) return;
    // 16. 최소 실적 미만 (부정 조건)
    if(handleBelowMinCheck(t)) return;
    // 17. 실적/금액 기반 검색
    if(handleAmountSearch(t)) return;
    // 18. 전체 비교
    if(handleCompare(t)){ showCompare(); return; }
    // 19. 주제별 검색
    if(handleTopicSearch(t)) return;
    // 20. 단일 카드 매칭
    var ck = matchCard(t);
    if(ck){ showCardDetail(ck); return; }
    // 21. 답변 불가
    addBot(NOT_FOUND_MSG);
    showMainMenu();
  }, 300);
}
