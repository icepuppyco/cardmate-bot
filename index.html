<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카드 프로모션 도우미</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f6fa;
      padding: 20px;
    }
    .chat-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
    .btn {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eef;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="chat-box">
  <h2>💳 카드 추천 도우미</h2>

  <p>월 렌탈료를 입력해주세요</p>
  <input type="number" id="rent" placeholder="예: 50000">

  <p>혜택 유형을 선택해주세요</p>

  <button class="btn" onclick="recommend('discount')">할인형</button>
  <button class="btn" onclick="recommend('cashback')">캐시백형</button>

  <div id="result" class="result"></div>
</div>

<script>
function recommend(type) {
  let rent = document.getElementById("rent").value;
  let result = "";

  if (!rent) {
    result = "렌탈료를 먼저 입력해주세요.";
  } else {
    if (type === "discount") {
      if (rent >= 50000) {
        result = "👉 추천: 프리미엄 할인 카드 (월 최대 2만원 할인)";
      } else {
        result = "👉 추천: 기본 할인 카드 (월 1만원 할인)";
      }
    } else {
      if (rent >= 50000) {
        result = "👉 추천: 고액 캐시백 카드 (최대 3만원)";
      } else {
        result = "👉 추천: 일반 캐시백 카드 (1만원)";
      }
    }

    result += "<br><br>📌 이벤트 안내: 신규 발급 시 1만원 추가 혜택!";
  }

  document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
